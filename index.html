<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunflower Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>CHANGE ONE NUMBER.</h1>
        <p class="subtitle">WATCH NATURE BREAK</p>

        <div class="flower-area">
            <canvas id="flowerCanvas" width="600" height="600"></canvas>
        </div>

        <div class="information">
            <div id="angle">137.5°</div>
            <div id="stage">BLOOM</div>
        </div>

        <div class="degree-control">
            <label for="degreeSlider">CHANGE ANGLE</label>

            <input
                type="range"
                id="degreeSlider"
                min="0"
                max="180"
                step="0.5"
                value="137.5"
            >

            <span id="degreeValue">137.5°</span>
        </div>

        <div class="controls">
            <button id="nextBtn">NEXT STAGE</button>
            <button id="resetBtn">RESET</button>
        </div>

        <p class="footer">MATHEMATICS OF NATURE</p>

    </main>

    <script src="script.js"></script>

</body>
</html>
